<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#111117" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Grand Theft Developer · Jarvis, Full-Stack Developer</title>
    <!-- Critical loader styles: the loading screen must paint on the first frame,
         before the main stylesheet (in dev it arrives via JS). Full styles:
         src/styles/loader.css -->
    <style>
      html { background: #0c0d1b; }
      .loader { position: fixed; top: 0; left: 0; z-index: 501; width: 100vw; height: 100vh; width: 100dvw; height: 100dvh;
        background: linear-gradient(189deg, #1f1f38 0.55%, #18182d 30.38%, #111222 65.19%, #0c0d1b 100%); }
      .loader .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    </style>
    <meta
      name="description"
      content="Portfolio of Jarvis, a full-stack developer in Miami. Fan-made GTA VI-style portfolio. Not affiliated with Rockstar Games."
    />
  </head>
  <body>
    <!-- Loading screen: static so it shows on the very first paint. The intro
         script (src/intro/intro.js) fades it out once fonts and images are ready. -->
    <div id="loader" class="loader" role="status">
      <span class="sr-only">Loading</span>
      <div class="loader__logo" aria-hidden="true">
        <div class="loader__silhouette"></div>
        <div class="loader__fill"></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
